<html>

<head>
  <script>

    function fizzBuzz(number) {
      
      if (number % 3 === 0 && number % 5 === 0) {
        return "FizzBuzz";
      }
      else if (number % 3 === 0) {
        return "Fizz";
      }
      else if (number % 5 === 0) {
        return "Buzz";
      }
      else {
        return number;
      }
    }
    for (let i = 1; i <= 100; i++) {
      
      const result = fizzBuzz(i);
      console.log(result);
    }
  </script>
</head>

</html>
