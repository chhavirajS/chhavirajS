<html>

<head>
    <script>

        function checkEvenOrOdd(number) {
            if (number % 2 === 0) {
                return "even";
            } else {
                return "odd";
            }
        }

        for (let i = 1; i <= 100; i++) {

            const result = checkEvenOrOdd(i);
            console.log(`Number ${i} is ${result}`);
        }

    </script>

</head>

</html>
